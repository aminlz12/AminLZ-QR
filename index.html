<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aminlz QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#16203a;--muted:#5d6783;--accent:#3b5bfd;--accent-ink:#fff;--line:#dde2f0;--err:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#eaeefc;--muted:#a3adcc;--accent:#7b93ff;--accent-ink:#0e1424;--line:#2a3558;--err:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#eaeefc;--muted:#a3adcc;--accent:#7b93ff;--accent-ink:#0e1424;--line:#2a3558;--err:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:0 0 6px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 26px}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],select{width:100%;padding:12px 14px;font-size:1rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:12px}.row>div{flex:1}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{color:var(--muted);font-weight:400}
.msg{min-height:1.4em;font-size:.9rem;margin:8px 0 0;color:var(--muted)}.msg.err{color:var(--err)}
.preview{display:flex;flex-direction:column;align-items:center;gap:14px}
.qrbox{display:flex;align-items:center;justify-content:center;width:100%;min-height:260px;border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--bg)}
canvas{max-width:100%;height:auto!important;image-rendering:pixelated;border-radius:6px}
.empty{color:var(--muted);text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap;width:100%}
button{flex:1;min-width:130px;padding:12px 16px;font-size:1rem;font-weight:600;border-radius:10px;border:1px solid var(--accent);cursor:pointer;font-family:inherit;background:var(--accent);color:var(--accent-ink)}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<main>
<h1>Aminlz QR</h1>
<p class="sub">Pega un enlace, personaliza el QR y descárgalo gratis</p>
<div class="wrap">
  <div class="card">
    <label for="url">Enlace o texto</label>
    <input id="url" type="text" inputmode="url" placeholder="https://www.ejemplo.com" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="msg" class="msg"></p>
    <div class="row">
      <div><label for="fg">Color del QR</label><input id="fg" type="color" value="#000000"></div>
      <div><label for="bg">Color de fondo</label><input id="bg" type="color" value="#ffffff"></div>
    </div>
    <label for="size">Tamaño: <span id="sv" class="val">512 px</span></label>
    <input id="size" type="range" min="128" max="1024" step="32" value="512">
    <label for="mar">Margen: <span id="mv" class="val">4 módulos</span></label>
    <input id="mar" type="range" min="0" max="10" step="1" value="4">
    <label for="ec">Corrección de errores</label>
    <select id="ec">
      <option value="L">Baja (L) · QR más simple</option>
      <option value="M" selected>Media (M) · recomendada</option>
      <option value="Q">Alta (Q)</option>
      <option value="H">Máxima (H) · más robusto</option>
    </select>
  </div>
  <div class="card preview">
    <div class="qrbox" id="box"><p class="empty" id="empty">Tu código QR aparecerá aquí</p><canvas id="cv" hidden></canvas></div>
    <div class="btns">
      <button id="dpng" disabled>⬇ Descargar PNG</button>
      <button id="dsvg" class="alt" disabled>⬇ Descargar SVG</button>
    </div>
    <p id="dh" class="hint">El SVG es vectorial: ideal para imprimir en cualquier tamaño.</p>
  </div>
</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var url=$('url'),fg=$('fg'),bg=$('bg'),size=$('size'),mar=$('mar'),ec=$('ec'),msg=$('msg'),cv=$('cv'),empty=$('empty'),dpng=$('dpng'),dsvg=$('dsvg'),dh=$('dh');
var qr=null,downloads=null,lastText='';

function normalize(t){
  t=t.trim();if(!t)return '';
  if(/^[a-z][a-z0-9+.-]*:/i.test(t)||/\s/.test(t))return t;
  if(/^[^\s\/]+\.[a-z]{2,}(\/.*)?$/i.test(t)||/^localhost/i.test(t))return 'https://'+t;
  return t;
}
function lum(h){var r=parseInt(h.substr(1,2),16)/255,g=parseInt(h.substr(3,2),16)/255,b=parseInt(h.substr(5,2),16)/255;
  function f(c){return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)}return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function setMsg(t,e){msg.textContent=t;msg.className='msg'+(e?' err':'')}

function build(){
  var text=normalize(url.value);lastText=text;
  $('sv').textContent=size.value+' px';$('mv').textContent=mar.value+' módulos';
  if(!text){qr=null;cv.hidden=true;empty.hidden=false;dpng.disabled=dsvg.disabled=true;setMsg('');return;}
  try{
    var q=qrcode(0,ec.value);q.addData(text);q.make();qr=q;
  }catch(e){
    qr=null;cv.hidden=true;empty.hidden=false;dpng.disabled=dsvg.disabled=true;
    setMsg('El texto es demasiado largo para un código QR. Acórtalo o baja la corrección de errores.',true);return;
  }
  draw();
  dpng.disabled=dsvg.disabled=false;
  var l1=lum(fg.value),l2=lum(bg.value),ratio=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
  if(l1>l2)setMsg('Aviso: el QR es más claro que el fondo; algunos lectores no lo leerán.',true);
  else if(ratio<3)setMsg('Aviso: poco contraste entre colores, puede costar escanearlo.',true);
  else setMsg(text!==url.value.trim()?'Se ha añadido https:// → '+text:'✓ Listo para escanear');
}
function draw(){
  var n=qr.getModuleCount(),m=parseInt(mar.value,10),total=n+2*m,px=Math.max(1,Math.floor(parseInt(size.value,10)/total)),W=px*total;
  cv.width=cv.height=W;var c=cv.getContext('2d');
  c.fillStyle=bg.value;c.fillRect(0,0,W,W);c.fillStyle=fg.value;
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+m)*px,(r+m)*px,px,px);
  cv.style.width=Math.min(W,320)+'px';cv.hidden=false;empty.hidden=true;
}
function svg(){
  var n=qr.getModuleCount(),m=parseInt(mar.value,10),t=n+2*m,d='';
  for(var r=0;r<n;r++){var k=0;while(k<n){if(qr.isDark(r,k)){var s=k;while(k<n&&qr.isDark(r,k))k++;d+='M'+(s+m)+' '+(r+m)+'h'+(k-s)+'v1h-'+(k-s)+'z';}else k++;}}
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+size.value+'" height="'+size.value+'" shape-rendering="crispEdges"><rect width="'+t+'" height="'+t+'" fill="'+bg.value+'"/><path fill="'+fg.value+'" d="'+d+'"/></svg>';
}
function fname(ext){
  var b=lastText.replace(/^https?:\/\//i,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,30)||'qr';
  return 'qr-'+b+'.'+ext;
}
function flash(t){var o=dh.textContent;dh.textContent=t;setTimeout(function(){dh.textContent=o},3000)}
function save(data,ext){
  var b=(data instanceof Blob)?data:new Blob([data],{type:'image/svg+xml'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname(ext);
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);flash('✓ Descargado');
}
dpng.addEventListener('click',function(){if(!qr)return;cv.toBlob(function(b){if(b)save(b,'png')},'image/png');});
dsvg.addEventListener('click',function(){if(!qr)return;save(svg(),'svg');});
[url,fg,bg,size,mar,ec].forEach(function(e){e.addEventListener('input',build)});

build();
})();
</script>
</body>
</html>
